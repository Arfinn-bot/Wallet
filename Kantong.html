    return '<pattern id="'+prefix+i+'" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate('+ang+')">'+
      '<rect width="7" height="7" fill="'+it.color+'"/><rect width="3" height="7" fill="'+hexA("#000000",.28)+'"/></pattern>';
  }).join("");
}
function fillFor(prefix,i,color){ return S.settings.patterns?"url(#"+prefix+i+")":color; }

function cashflowChart(){
  const months=[]; for(let i=5;i>=0;i--) months.push(addMonths(UI.month,-i));
  const data=months.map(k=>Object.assign({k:k},monthStats(k)));
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const W=720,H=250,PL=52,PR=10,PT=14,PB=30;
  const iw=W-PL-PR, ih=H-PT-PB, bw=iw/months.length;
  const nice=Math.ceil(max/1e6)*1e6||1e6;
  let g="";
  for(let i=0;i<=4;i++){
    const y=PT+ih-(ih*i/4);
    g+='<line class="grid-line" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>'+
       '<text class="axis-txt" x="'+(PL-8)+'" y="'+(y+3.5)+'" text-anchor="end">'+short(nice*i/4).replace("Rp","")+'</text>';
  }
  let bars="";
  data.forEach((d,i)=>{
    const x=PL+i*bw, cw=Math.min(22,bw*0.28), gap=5;
    const cx=x+bw/2;
    const hi=Math.max(2,(d.inc/nice)*ih), he=Math.max(2,(d.exp/nice)*ih);
    const on=d.k===UI.month;
    bars+='<g class="bar-group">'+
      '<rect class="bar-glow" x="'+(x+2)+'" y="'+PT+'" width="'+(bw-4)+'" height="'+ih+'" rx="9" fill="'+hexA("#4DA3FF",.07)+'"/>'+
      '<rect class="bar" x="'+(cx-cw-gap/2)+'" y="'+(PT+ih-hi)+'" width="'+cw+'" height="'+hi+'" rx="4" fill="'+fillFor("cfi",0,"#2FE08A")+'" style="animation-delay:'+(i*70)+'ms"/>'+
      '<rect class="bar" x="'+(cx+gap/2)+'" y="'+(PT+ih-he)+'" width="'+cw+'" height="'+he+'" rx="4" fill="'+fillFor("cfo",0,"#FF4D6D")+'" style="animation-delay:'+(i*70+40)+'ms"/>'+
      '<text class="axis-txt'+(on?" on":"")+'" x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+mShort(d.k)+'</text>'+
      '<rect class="bar-hit" x="'+x+'" y="'+PT+'" width="'+bw+'" height="'+ih+'" data-month="'+d.k+'" '+
      'data-tip="'+esc(mLabel(d.k))+'|Pemasukan::#2FE08A::'+rp(d.inc)+'|Pengeluaran::#FF4D6D::'+rp(d.exp)+'|Selisih::'+(d.net>=0?"#2FE08A":"#FF4D6D")+'::'+(d.net>=0?"+":"−")+rp(Math.abs(d.net))+'"/>'+
      '</g>';
  });
  const defs='<defs>'+patternsDef([{color:"#2FE08A"}],"cfi")+patternsDef([{color:"#FF4D6D"}],"cfo")+'</defs>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik arus kas enam bulan">'+defs+g+bars+'</svg>';
}
function donutChart(){
  const items=catTotals(UI.month,"out");
  const total=items.reduce((s,i)=>s+i.value,0);
  if(!total) return {svg:'<div class="empty"><span class="em-ic">'+svg("pie")+'</span><b>Belum ada pengeluaran</b><p>Catat transaksi pertama bulan ini untuk melihat komposisinya.</p></div>',legend:""};
  const R=62,SW=28,C=2*Math.PI*R, size=180;
  let off=0, segs="";
  const top=items.slice(0,8);
  const rest=items.slice(8);
  if(rest.length) top.push({cat:{id:"__rest",name:"Lainnya ("+rest.length+")",color:"#7C93A8",icon:"dots"},value:rest.reduce((s,i)=>s+i.value,0)});
  top.forEach((it,i)=>{
    const frac=it.value/total, len=Math.max(0,C*frac-2.5);
    segs+='<circle class="donut-seg" cx="'+size/2+'" cy="'+size/2+'" r="'+R+'" fill="none" stroke="'+fillFor("dn",i,it.cat.color)+'" '+
      'stroke-width="'+SW+'" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" '+
      'data-cat="'+it.cat.id+'" data-tip="'+esc(it.cat.name)+'|Pengeluaran::'+it.cat.color+'::'+rp(it.value)+'|Porsi::'+it.cat.color+'::'+(frac*100).toFixed(1).replace(".",",")+'%"/>';
    off+=C*frac;
  });
  const defs='<defs>'+patternsDef(top.map(t=>({color:t.cat.color})),"dn")+'</defs>';
  const svgStr='<svg viewBox="0 0 '+size+' '+size+'" style="max-width:210px;margin:6px auto 0" role="img" aria-label="Komposisi pengeluaran per kategori">'+defs+
    '<g transform="rotate(-90 '+size/2+' '+size/2+')">'+segs+'</g>'+
    '<text x="'+size/2+'" y="'+(size/2-4)+'" text-anchor="middle" class="num" style="fill:var(--text);font-size:17px;font-weight:700">'+short(total)+'</text>'+
    '<text x="'+size/2+'" y="'+(size/2+14)+'" text-anchor="middle" style="fill:var(--faint);font-size:9px;font-weight:700;letter-spacing:.1em">TOTAL KELUAR</text></svg>';
  const legend=top.map(it=>{
    const pc=(it.value/total*100);
    return '<button class="legend-row" data-cat="'+it.cat.id+'" style="--c:'+it.cat.color+'">'+
      '<i class="sw"></i><span class="nm">'+esc(it.cat.name)+'</span>'+
      '<span class="pc">'+pc.toFixed(1).replace(".",",")+'%</span><span class="am">'+short(it.value)+'</span></button>';
  }).join("");
  return {svg:svgStr,legend:legend};
}
function sparkPath(series,w,h,pad){
  pad=pad||3;
  const vals=series.map(p=>p.value);
  const mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  const rng=(mx-mn)||1;
  const pts=series.map((p,i)=>[pad+i*(w-pad*2)/Math.max(1,series.length-1), h-pad-((p.value-mn)/rng)*(h-pad*2)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const area=line+"L"+pts[pts.length-1][0].toFixed(1)+" "+h+"L"+pts[0][0].toFixed(1)+" "+h+"Z";
  return {line:line,area:area,last:pts[pts.length-1]};
}
function heroSpark(){
  const s=totalBalanceSeries(30);
  const W=600,H=82, p=sparkPath(s,W,H,6);
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="hs" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+hexA(S.settings.accent,.42)+'"/><stop offset="100%" stop-color="'+hexA(S.settings.accent,0)+'"/></linearGradient></defs>'+
    '<path d="'+p.area+'" fill="url(#hs)"/>'+
    '<path class="spark-line" pathLength="1" d="'+p.line+'" style="stroke:var(--accent)" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+p.last[0].toFixed(1)+'" cy="'+p.last[1].toFixed(1)+'" r="3.4" style="fill:var(--accent)"/></svg>';
}
function miniSpark(series,color,w,h){
  const p=sparkPath(series,w||220,h||38,3);
  const gid="ms"+Math.random().toString(36).slice(2,7);
  return '<svg viewBox="0 0 '+(w||220)+' '+(h||38)+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+hexA(color,.34)+'"/><stop offset="100%" stop-color="'+hexA(color,0)+'"/></linearGradient></defs>'+
    '<path d="'+p.area+'" fill="url(#'+gid+')"/><path class="spark-line" pathLength="1" d="'+p.line+'" style="stroke:'+color+'" vector-effect="non-scaling-stroke"/></svg>';
}
function guilloche(R,r,d,turns,color,op){
  let pts=[]; const steps=900;
  for(let i=0;i<=steps;i++){
    const t=i/steps*turns*Math.PI*2;
    const x=(R-r)*Math.cos(t)+d*Math.cos((R-r)/r*t);
    const y=(R-r)*Math.sin(t)-d*Math.sin((R-r)/r*t);
    pts.push((x+150).toFixed(1)+" "+(y+150).toFixed(1));
  }
  return '<svg viewBox="0 0 300 300" aria-hidden="true"><path d="M'+pts.join("L")+'" fill="none" stroke="'+color+'" stroke-width="'+op+'" opacity=".85"/></svg>';
}
function trendChip(cur,prev,inverse){
  if(!prev) return '<span class="trend flat">'+svg("dots")+'baru</span>';
  const pct=((cur-prev)/Math.abs(prev))*100;
  const up=pct>=0, good=inverse?!up:up;
  return '<span class="trend '+(Math.abs(pct)<0.5?"flat":good?"good":"bad")+'">'+
    svg(Math.abs(pct)<0.5?"dots":up?"upRight":"downRight")+Math.abs(pct).toFixed(0)+'%</span>';
}

function heatmap(){
  const k=UI.month, dim=daysIn(k), first=parseISO(k+"-01");
  const ws=Number(S.settings.weekStart)||0;
  let lead=(first.getDay()+6)%7; if(ws===1) lead=first.getDay();
  const map={};
  for(const t of live()) if(t.type==="out"&&t.date.slice(0,7)===k) map[t.date]=(map[t.date]||0)+t.amount;
  const vals=Object.keys(map).map(d=>map[d]);
  const mx=Math.max(1,...vals);
  const dows=ws===1?["Min","Sen","Sel","Rab","Kam","Jum","Sab"]:DOW;
  let cells="";
  for(let i=0;i<lead;i++) cells+='<div class="heat-cell pad"></div>';
  const tIso=iso(today());
  for(let d=1;d<=dim;d++){
    const ds=k+"-"+pad2(d), v=map[ds]||0, ratio=v/mx;
    const bg=v?hexA("#FF4D6D",.12+ratio*.72):"var(--surface-2)";
    const future=ds>tIso;
    cells+='<button class="heat-cell'+(ds===tIso?" today":"")+(future?" future":"")+'" style="background:'+bg+(v?';color:'+(ratio>.55?"#fff":"var(--text)"):'')+'" '+
      'data-day="'+ds+'" data-tip="'+esc(longDate(ds))+'|Pengeluaran::#FF4D6D::'+rp(v)+'">'+d+'</button>';
  }
  return '<div class="heat"><div class="heat-dow">'+dows.map(d=>'<span>'+d+'</span>').join("")+'</div>'+
    '<div class="heat-grid">'+cells+'</div>'+
    '<div class="heat-legend"><span>Sedikit</span>'+[0,.2,.4,.6,.85].map(a=>'<i style="background:'+(a?hexA("#FF4D6D",.12+a*.72):"var(--surface-2)")+'"></i>').join("")+
    '<span>Banyak</span><span style="margin-left:auto">Maks '+short(mx)+'</span></div></div>';
}

/* ------------------------------ budgets --------------------------------- */
function renderBudgets(){
  const host=$("#view-anggaran");
  const cats=S.categories.filter(c=>c.kind==="out").slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const totals=catTotals(UI.month,"out");
  const withB=cats.filter(c=>c.budget>0);
  const totalB=withB.reduce((s,c)=>s+c.budget,0);
  const spentB=withB.reduce((s,c)=>s+((totals.find(t=>t.cat.id===c.id)||{value:0}).value),0);
  const pct=totalB?clamp(spentB/totalB*100,0,999):0;
  const dim=daysIn(UI.month), dayNow=UI.month===mkey(today())?today().getDate():dim;
  const daysLeft=Math.max(1,dim-dayNow+1);
  const ideal=totalB*(dayNow/dim);
  const rows=cats.map((c,i)=>{
    const spent=(totals.find(t=>t.cat.id===c.id)||{value:0}).value;
    const b=c.budget||0, p=b?clamp(spent/b*100,0,140):0;
    const cls=!b?"":spent>b?"over":p>85?"near":"safe";
    return '<div class="bud-row" draggable="true" data-bud-id="'+c.id+'" style="--c:'+c.color+'">'+
      '<span class="drag-h" title="Seret untuk mengurutkan prioritas">'+svg("drag")+'</span>'+
      '<div class="bud-mid"><div class="bud-name">'+svg(c.icon,"","width:14px;height:14px;color:"+c.color)+esc(c.name)+
        (cls?'<span class="st '+cls+'">'+(cls==="over"?"LEWAT "+short(spent-b):cls==="near"?"HAMPIR BATAS":"AMAN")+'</span>':'<span class="st" style="color:var(--faint);background:color-mix(in srgb,var(--text) 8%,transparent)">TANPA BATAS</span>')+'</div>'+
        '<div class="bud-bar"><i class="'+(spent>b&&b?"over":"")+'" style="width:'+(b?clamp(p,0,100):0)+'%"></i></div>'+
        '<div class="bud-meta"><span>'+rp(spent)+' terpakai</span>'+(b?'<span>·</span><span>'+Math.round(p)+'%</span>':'')+
        (b?'<span style="margin-left:auto;color:'+(spent>b?"var(--out)":"var(--in)")+'">'+(spent>b?"lewat batas":"sisa "+rp(b-spent))+'</span>':'')+'</div></div>'+
      '<div class="bud-right"><input class="bud-input" inputmode="numeric" value="'+(b?money(b):"")+'" placeholder="Tanpa batas" data-bud-input="'+c.id+'" aria-label="Anggaran '+esc(c.name)+'">'+
      '<span class="ord-btns"><button data-act="bud-up" data-id="'+c.id+'" aria-label="Naikkan">'+svg("chevU")+'</button>'+
      '<button data-act="bud-down" data-id="'+c.id+'" aria-label="Turunkan">'+svg("chevD")+'</button></span></div></div>';
  }).join("");
  host.innerHTML=
    '<div class="card reveal" style="--c:'+(pct>100?"var(--out)":pct>85?"var(--warn)":"var(--in)")+'">'+
      '<div class="sec-head"><div><div class="sec-title"><span class="bar"></span>Anggaran '+esc(mLabel(UI.month))+'</div>'+
      '<div class="sec-sub">Seret baris untuk mengatur prioritas · angka langsung tersimpan</div></div>'+
      '<button class="btn sm" data-act="copy-budget">'+svg("copy")+'Salin ke bulan depan</button></div>'+
      '<div class="pad" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;align-items:center">'+
        '<div><div style="font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.1em;text-transform:uppercase">Terpakai / Pagu</div>'+
        '<div class="num" style="font-size:28px;font-weight:700;margin-top:4px">'+short(spentB)+' <span style="font-size:15px;color:var(--faint)">/ '+short(totalB)+'</span></div>'+
        '<div class="bud-bar" style="height:10px;margin-top:10px;--c:'+(pct>100?"var(--out)":pct>85?"var(--warn)":"var(--in)")+'"><i class="'+(pct>100?"over":"")+'" style="width:'+clamp(pct,0,100)+'%"></i></div>'+
        '<div style="font-size:11.5px;color:var(--faint);margin-top:6px">'+Math.round(pct)+'% terpakai · hari ke-'+dayNow+' dari '+dim+'</div></div>'+
        '<div><div style="font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.1em;text-transform:uppercase">Sisa aman harian</div>'+
        '<div class="num" style="font-size:28px;font-weight:700;margin-top:4px;color:'+(spentB>totalB?"var(--out)":"var(--in)")+'">'+rp(Math.max(0,Math.floor((totalB-spentB)/daysLeft)))+'</div>'+
        '<div style="font-size:11.5px;color:var(--faint);margin-top:6px">untuk '+daysLeft+' hari tersisa</div></div>'+
        '<div><div style="font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.1em;text-transform:uppercase">Ritme belanja</div>'+
        '<div class="num" style="font-size:28px;font-weight:700;margin-top:4px;color:'+(spentB>ideal?"var(--warn)":"var(--in)")+'">'+(spentB>ideal?"+":"−")+short(Math.abs(spentB-ideal))+'</div>'+
        '<div style="font-size:11.5px;color:var(--faint);margin-top:6px">'+(spentB>ideal?"lebih cepat":"lebih hemat")+' dari target proporsional '+short(ideal)+'</div></div>'+
      '</div></div>'+
    '<div class="card reveal"><div class="sec-head"><div><div class="sec-title"><span class="bar" style="background:var(--warn)"></span>Pagu per Kategori</div>'+
    '<div class="sec-sub">'+withB.length+' dari '+cats.length+' kategori punya batas</div></div></div>'+
    '<div class="bud-list" id="budList">'+rows+'</div></div>';
  observeReveals(host);
}

      '<div class="amt num">'+(t.type==="in"?"+":t.type==="out"?"−":"")+rpSpace(t.amount)+'</div>'+
      '<div class="nt">'+esc(t.note||c.name)+'</div></div>'+

function readDraftFromForm(){
  const d=UI.drawer; if(!d||!d.draft) return;
  const amt=$("#dAmt"), acc=$("#dAcc"), to=$("#dTo"), date=$("#dDate"), note=$("#dNote");
  if(amt) d.draft.amount=parseAmount(amt.value);
  if(acc) d.draft.accountId=acc.value;
  if(to) d.draft.toAccountId=to.value;
  if(date&&date.value) d.draft.date=date.value;
  if(note) d.draft.note=note.value;

function showErr(hostId,wrapId,msg){
  const h=$("#"+hostId); if(h) h.innerHTML='<div class="err-msg">'+svg("alert")+esc(msg)+'</div>';
  const w=$("#"+wrapId); if(w){ w.classList.add("err"); setTimeout(()=>w.classList.remove("err"),400); }
}
function saveTxFromDrawer(){
  readDraftFromForm();
  const d=UI.drawer, m=d.draft;
  if(!m.amount||m.amount<=0) return showErr("dErr","dAmtWrap","Nominal harus lebih dari nol.");
  if(m.type!=="transfer"&&!m.categoryId) return showErr("dErr","dAmtWrap","Pilih kategori terlebih dahulu.");
  if(!m.accountId) return showErr("dErr","dAmtWrap","Pilih akun.");
  if(m.type==="transfer"&&m.accountId===m.toAccountId) return showErr("dErr","dAmtWrap","Akun asal dan tujuan tidak boleh sama.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(m.date||"")) return showErr("dErr","dAmtWrap","Tanggal tidak valid.");
  const now=Date.now();
  let rec;
  if(d.mode==="edit"){
    rec=S.tx.find(x=>x.id===d.id);
    if(!rec) return;
    const before=Object.assign({},rec);
    Object.assign(rec,{type:m.type,amount:m.amount,categoryId:m.type==="transfer"?"transfer":m.categoryId,
      accountId:m.accountId,toAccountId:m.type==="transfer"?m.toAccountId:null,date:m.date,note:m.note.trim(),updatedAt:now});
    pushUndo("perubahan transaksi",()=>{ const x=S.tx.find(y=>y.id===before.id); if(x) Object.assign(x,before,{updatedAt:Date.now()}); });
  } else {
    rec={id:uid("tx"),type:m.type,amount:m.amount,categoryId:m.type==="transfer"?"transfer":m.categoryId,
      accountId:m.accountId,toAccountId:m.type==="transfer"?m.toAccountId:null,date:m.date,note:m.note.trim(),
      createdAt:now,updatedAt:now,deleted:false};
    S.tx.push(rec);
    pushUndo("transaksi baru",()=>{ const x=S.tx.find(y=>y.id===rec.id); if(x){x.deleted=true;x.updatedAt=Date.now();} });
  }
  UI.flash=rec.id; setTimeout(()=>{UI.flash=null;},1600);
  closeDrawer(); commit();
  toast(d.mode==="edit"?"Transaksi diperbarui":"Transaksi tercatat",
    (m.type==="in"?"+":m.type==="out"?"−":"")+rp(m.amount)+" · "+(m.note||catById(rec.categoryId).name),"ok",
    {label:"Urungkan",icon:"undo",fn:doUndo});
  checkBudgetAlert(rec);
}
function checkBudgetAlert(rec){
  if(!S.settings.budgetAlert||rec.type!=="out") return;
  const c=catById(rec.categoryId); if(!c.budget) return;
  const k=rec.date.slice(0,7);
  const spent=(catTotals(k,"out").find(x=>x.cat.id===c.id)||{value:0}).value;
  const before=spent-rec.amount;
  if(before<=c.budget&&spent>c.budget){
    toast("Anggaran "+c.name+" terlampaui","Terpakai "+rp(spent)+" dari pagu "+rp(c.budget),"warn",
      {label:"Lihat",icon:"target",fn:()=>{ UI.month=k; go("anggaran"); }});
  } else if(before<=c.budget*.85&&spent>c.budget*.85){
    toast(c.name+" mendekati batas","Sisa pagu "+rp(c.budget-spent),"info");
  }
}
function quickSave(e){
  e.preventDefault();
  const amount=parseAmount($("#qAmt").value);
  const cat=UI.quick.cat, acc=$("#qAcc").value, date=$("#qDate").value, note=$("#qNote").value.trim();
  if(!amount) return showErr("qErr","qAmtWrap","Isi nominal dulu ya.");
  if(!cat) return showErr("qErr","qAmtWrap","Pilih kategori.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return showErr("qErr","qAmtWrap","Tanggal tidak valid.");
  const now=Date.now();
  const rec={id:uid("tx"),type:UI.quick.type,amount:amount,categoryId:cat,accountId:acc,toAccountId:null,
    date:date,note:note||catById(cat).name,createdAt:now,updatedAt:now,deleted:false};
  S.tx.push(rec);
  pushUndo("transaksi baru",()=>{ const x=S.tx.find(y=>y.id===rec.id); if(x){x.deleted=true;x.updatedAt=Date.now();} });
  UI.flash=rec.id; setTimeout(()=>{UI.flash=null;},1600);
  if(date.slice(0,7)!==UI.month) UI.month=date.slice(0,7);
  commit();
  toast("Tercatat "+(rec.type==="in"?"+":"−")+rp(amount),rec.note+" · "+accById(acc).name,"ok",{label:"Urungkan",icon:"undo",fn:doUndo});
  checkBudgetAlert(rec);
  const f=$("#qAmt"); if(f) f.focus();
}
function saveAccount(){
  const d=UI.drawer, m=d.draft;
  m.name=($("#aName").value||"").trim();
  m.type=$("#aType").value;
  m.opening=parseAmount($("#aOpen").value);
  if(!m.name) return showErr("aErr","aOpenWrap","Nama akun wajib diisi.");
  m.icon=ACCICON[m.type];
  if(d.id){
    const a=S.accounts.find(x=>x.id===d.id);
    const before=Object.assign({},a);
    Object.assign(a,m);
    pushUndo("perubahan akun",()=>{ const x=S.accounts.find(y=>y.id===before.id); if(x) Object.assign(x,before); });
  } else {
    const a=Object.assign({id:uid("ac")},m);
    S.accounts.push(a);
    pushUndo("akun baru",()=>{ S.accounts=S.accounts.filter(x=>x.id!==a.id); });
  }
  closeDrawer(); commit(); toast("Akun disimpan",m.name+" · "+ACCTYPE[m.type],"ok");
}

/* ============================ import / export =========================== */
function download(name,content,mime){
  const blob=new Blob([content],{type:mime||"application/octet-stream"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function exportJSON(){
  const data={v:1,exportedAt:new Date().toISOString(),app:"Lumbung",tx:S.tx,categories:S.categories,accounts:S.accounts,views:S.views};
  download("lumbung-cadangan-"+iso(today())+".json",JSON.stringify(data,null,2),"application/json");
  toast("Cadangan diunduh",live().length+" transaksi tersimpan dalam berkas JSON","ok");
}
function csvCell(v){ const s=String(v==null?"":v); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function exportCSV(rows,label){
  const list=(rows||live()).slice().sort((a,b)=>a.date<b.date?-1:1);
  const head=["Tanggal","Jenis","Kategori","Catatan","Akun","Akun Tujuan","Nominal"];
  const lines=[head.join(";")];
  list.forEach(t=>lines.push([t.date,t.type==="in"?"Pemasukan":t.type==="out"?"Pengeluaran":"Transfer",
    catById(t.categoryId).name,t.note||"",accById(t.accountId).name,t.toAccountId?accById(t.toAccountId).name:"",
    (t.type==="out"?"-":"")+t.amount].map(csvCell).join(";")));
  download("lumbung-transaksi-"+iso(today())+".csv","\uFEFF"+lines.join("\r\n"),"text/csv;charset=utf-8");
  toast("CSV diunduh",(label||list.length+" transaksi")+" · pemisah titik koma","ok");
}
$("#importFile").addEventListener("change",function(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const o=JSON.parse(String(rd.result));
      if(!o||!Array.isArray(o.tx)) throw new Error("Struktur berkas tidak dikenali");
      const before=live().length;
      const snapshot=JSON.stringify({tx:S.tx,categories:S.categories,accounts:S.accounts,views:S.views});
      mergeRemote(o);
      pushUndo("impor berkas",()=>{ const s=JSON.parse(snapshot); S.tx=s.tx;S.categories=s.categories;S.accounts=s.accounts;S.views=s.views; });
      commit(); renderSettings();
      toast("Impor berhasil",(live().length-before)+" transaksi baru · total "+live().length,"ok",{label:"Urungkan",icon:"undo",fn:doUndo});
    }catch(err){ toast("Gagal mengimpor",err.message||"Berkas JSON tidak valid","error"); }
    e.target.value="";
  };
  rd.onerror=function(){ toast("Gagal membaca berkas",null,"error"); e.target.value=""; };
  rd.readAsText(f);
});

function openPalette(){ UI.palette=true; UI.palIdx=0; palWrap.classList.add("on"); palInput.value=""; renderPalette(""); setTimeout(()=>palInput.focus(),60); }
function closePalette(){ UI.palette=false; palWrap.classList.remove("on"); }
function renderPalette(q){
  q=(q||"").trim().toLowerCase();
  const cmds=COMMANDS.filter(c=>!q||(c.t+" "+c.s).toLowerCase().indexOf(q)>=0);
  const txs=q?live().filter(t=>(t.note+" "+catById(t.categoryId).name+" "+t.amount).toLowerCase().indexOf(q)>=0)
    .sort((a,b)=>a.date<b.date?1:-1).slice(0,6):[];
  UI.palItems=cmds.map(c=>({kind:"cmd",c:c})).concat(txs.map(t=>({kind:"tx",t:t})));
  UI.palIdx=clamp(UI.palIdx,0,Math.max(0,UI.palItems.length-1));
  let html="";
  if(cmds.length) html+='<div class="pal-sec">Perintah</div>';
  cmds.forEach((c,i)=>{ html+='<button class="pal-item'+(UI.palIdx===i?" on":"")+'" data-pal="'+i+'"><span class="pi">'+svg(c.i)+'</span><span class="pt"><b>'+esc(c.t)+'</b><i>'+esc(c.s)+'</i></span></button>'; });
  if(txs.length) html+='<div class="pal-sec">Transaksi</div>';
  txs.forEach((t,j)=>{
    const i=cmds.length+j, c=catById(t.categoryId);
    html+='<button class="pal-item'+(UI.palIdx===i?" on":"")+'" data-pal="'+i+'"><span class="pi" style="color:'+c.color+'">'+svg(c.icon)+'</span>'+
      '<span class="pt"><b>'+esc(t.note||c.name)+'</b><i>'+esc(longDate(t.date))+' · '+esc(accById(t.accountId).name)+'</i></span>'+
      '<span class="num" style="font-weight:700;color:'+(t.type==="in"?"var(--in)":t.type==="out"?"var(--out)":"var(--xf)")+'">'+(t.type==="in"?"+":t.type==="out"?"−":"")+short(t.amount)+'</span></button>';
  });
  if(!UI.palItems.length) html='<div class="empty" style="padding:26px"><b>Tidak ada hasil</b><p>Coba kata kunci lain.</p></div>';
  palList.innerHTML=html;
  const on=palList.querySelector(".pal-item.on"); if(on&&on.scrollIntoView) on.scrollIntoView({block:"nearest"});
}
function runPal(i){
  const it=UI.palItems[i]; if(!it) return;
  closePalette();
  if(it.kind==="cmd") it.c.run();
  else openDrawer({kind:"tx",mode:"view",id:it.t.id});
}
palInput.addEventListener("input",()=>{ UI.palIdx=0; renderPalette(palInput.value); });
palInput.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); UI.palIdx=clamp(UI.palIdx+1,0,UI.palItems.length-1); renderPalette(palInput.value); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); UI.palIdx=clamp(UI.palIdx-1,0,UI.palItems.length-1); renderPalette(palInput.value); }
  else if(e.key==="Enter"){ e.preventDefault(); runPal(UI.palIdx); }
});
palList.addEventListener("click",e=>{ const b=e.target.closest("[data-pal]"); if(b) runPal(+b.dataset.pal); });
palWrap.addEventListener("mousedown",e=>{ if(e.target===palWrap) closePalette(); });

/* ============================== chart tips ============================== */
const tip=$("#chartTip");
function showTip(el,x,y){
  const raw=el.getAttribute("data-tip")||"";
  const parts=raw.split("|");
  let html='<div class="t">'+esc(parts[0])+'</div>';
  parts.slice(1).forEach(p=>{
    const seg=p.split("::");
    html+='<div class="l">'+(seg[1]?'<i style="background:'+esc(seg[1])+'"></i>':'')+'<span>'+esc(seg[0])+'</span><b>'+esc(seg[2]||"")+'</b></div>';
  });
  tip.innerHTML=html; tip.classList.add("on");
  const r=tip.getBoundingClientRect();
  tip.style.left=clamp(x+14,8,window.innerWidth-r.width-8)+"px";
  tip.style.top=clamp(y-r.height-12,8,window.innerHeight-r.height-8)+"px";
}
function hideTip(){ tip.classList.remove("on"); }
document.addEventListener("mousemove",e=>{
  const el=e.target.closest?e.target.closest("[data-tip]"):null;
  if(el) showTip(el,e.clientX,e.clientY); else hideTip();
},{passive:true});
document.addEventListener("mouseleave",hideTip);
window.addEventListener("scroll",hideTip,{passive:true});

/* ============================ event delegation ========================== */
document.addEventListener("click",function(e){
  const nav=e.target.closest("[data-nav]");
  if(nav){ e.preventDefault(); go(nav.dataset.nav); return; }
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, v=el.dataset.v;
  if(el.closest("[data-stop]")&&act!=="sel-tx") return;
  switch(act){
    case "new-tx": openDrawer({kind:"tx",mode:"create"}); break;
    case "new-account": openDrawer({kind:"account"}); break;
    case "edit-account": openDrawer({kind:"account",id:id}); break;
    case "del-account": openDrawer({kind:"delaccount",id:id}); break;
    case "new-transfer": openDrawer({kind:"tx",mode:"create",draft:{type:"transfer",amount:0,categoryId:"transfer",
      accountId:id||S.accounts[0].id,toAccountId:(S.accounts.find(a=>a.id!==(id||S.accounts[0].id))||S.accounts[0]).id,date:iso(today()),note:"Transfer antar akun"}}); break;
    case "open-tx": if(!e.target.closest(".chk")&&!e.target.closest(".tx-acts")) openDrawer({kind:"tx",mode:"view",id:el.dataset.id}); break;
    case "edit-tx": e.stopPropagation(); openDrawer({kind:"tx",mode:"edit",id:id}); break;
    case "del-tx": e.stopPropagation(); deleteTx(id); if(UI.drawer&&UI.drawer.id===id) closeDrawer(); break;
    case "dup-tx": {
      const t=S.tx.find(x=>x.id===id); if(!t) break;
      openDrawer({kind:"tx",mode:"create",draft:Object.assign({},t,{id:undefined,date:iso(today()),amount:t.amount})});
      break;
    }
    case "close-drawer": closeDrawer(); break;
    case "save-tx": saveTxFromDrawer(); break;
    case "save-account": saveAccount(); break;
    case "d-type": { readDraftFromForm(); UI.drawer.draft.type=v;
      const cats=S.categories.filter(c=>c.kind===(v==="transfer"?"xf":v));
      if(v==="transfer"){ UI.drawer.draft.categoryId="transfer"; if(!UI.drawer.draft.toAccountId||UI.drawer.draft.toAccountId===UI.drawer.draft.accountId){ const o=S.accounts.find(a=>a.id!==UI.drawer.draft.accountId); UI.drawer.draft.toAccountId=o?o.id:null; } }
      else if(!cats.some(c=>c.id===UI.drawer.draft.categoryId)) UI.drawer.draft.categoryId=cats[0]?cats[0].id:"";
      renderDrawer(); break; }
    case "d-cat": readDraftFromForm(); UI.drawer.draft.categoryId=id; renderDrawer(); break;
    case "d-amt": { const inp=$("#dAmt"); inp.value=money(parseAmount(inp.value)+Number(v)); UI.drawer.draft.amount=parseAmount(inp.value); break; }
    case "d-amt-clear": { const inp=$("#dAmt"); inp.value=""; UI.drawer.draft.amount=0; inp.focus(); break; }
    case "a-color": UI.drawer.draft.color=v; UI.drawer.draft.name=$("#aName").value; UI.drawer.draft.type=$("#aType").value; UI.drawer.draft.opening=parseAmount($("#aOpen").value); renderDrawer(); break;
    case "quick-type": { UI.quick.type=v;
      const keep={amt:$("#qAmt")?$("#qAmt").value:"",note:$("#qNote")?$("#qNote").value:"",acc:$("#qAcc")?$("#qAcc").value:null,date:$("#qDate")?$("#qDate").value:null};
      renderDashboard();
      if($("#qAmt")) $("#qAmt").value=keep.amt;
      if($("#qNote")) $("#qNote").value=keep.note;
      if(keep.acc&&$("#qAcc")) $("#qAcc").value=keep.acc;
      if(keep.date&&$("#qDate")) $("#qDate").value=keep.date;
      break; }
    case "quick-cat": { UI.quick.cat=id;
      $$(".quick-cats .cat-chip").forEach(b=>b.classList.toggle("on",b.dataset.id===id)); break; }
    case "f-type": UI.type=v; UI.cat="all"; UI.activeView=null; UI.selected.clear(); renderTxToolbar(); renderTxList(); renderSidebar(); break;
    case "sort": { const p=UI.sort.split("-"); UI.sort=p[0]===v?v+"-"+(p[1]==="desc"?"asc":"desc"):v+"-desc"; UI.activeView=null; renderTxToolbar(); renderTxList(); break; }
    case "clear-q": UI.q=""; $("#globalSearch").value=""; UI.activeView=null; renderTxToolbar(); renderTxList(); break;
    case "clear-filters": UI.q="";UI.type="all";UI.cat="all";UI.acc="all";UI.period="bulan";UI.sort="date-desc";UI.activeView=null;UI.selected.clear();
      $("#globalSearch").value=""; renderTxToolbar(); renderTxList(); renderSidebar(); break;
    case "bulk-clear": UI.selected.clear(); renderTxList(); break;
    case "bulk-del": deleteTx(Array.from(UI.selected)); break;
    case "bulk-export": exportCSV(live().filter(t=>UI.selected.has(t.id)),UI.selected.size+" transaksi terpilih"); break;
    case "save-view": openDrawer({kind:"saveview"}); break;
    case "confirm-save-view": {
      const name=($("#vName").value||"").trim()||"Tampilan "+(S.views.length+1);
      const view={id:uid("vw"),name:name,order:S.views.length,f:{q:UI.q,type:UI.type,cat:UI.cat,acc:UI.acc,period:UI.period,sort:UI.sort}};
      S.views.push(view); UI.activeView=view.id; closeDrawer(); commit(); toast("Tampilan disimpan",name,"ok"); break;
    }
    case "del-view": { e.stopPropagation();
      const view=S.views.find(x=>x.id===id); if(!view) break;
      S.views=S.views.filter(x=>x.id!==id); if(UI.activeView===id) UI.activeView=null;
      pushUndo("tampilan dihapus",()=>{ S.views.push(view); });
      commit(); toast("Tampilan dihapus",view.name,"warn",{label:"Urungkan",icon:"undo",fn:doUndo}); break; }
    case "filter-acc": UI.acc=id; UI.cat="all"; UI.type="all"; UI.period="all"; UI.activeView=null; go("transaksi"); break;
    case "bud-up": case "bud-down": {
      const list=S.categories.filter(c=>c.kind==="out").sort((a,b)=>(a.order||0)-(b.order||0));
      const i=list.findIndex(c=>c.id===id), j=act==="bud-up"?i-1:i+1;
      if(i<0||j<0||j>=list.length) break;
      const tmp=list[i]; list[i]=list[j]; list[j]=tmp;
      list.forEach((c,k)=>c.order=k); commit(); break;
    }
    case "copy-budget": {
      toast("Anggaran siap dipakai bulan depan","Pagu bersifat bulanan dan otomatis berlaku di semua bulan.","info"); break; }
    case "confirm-del-account": {
      const n=live().filter(t=>t.accountId===id||t.toAccountId===id).length;
      const mv=$("#moveTo");
      const acc=accById(id), snapshotTx=JSON.stringify(S.tx), snapshotAcc=JSON.stringify(S.accounts);
      if(n&&mv){ const to=mv.value;
        S.tx.forEach(t=>{ if(t.accountId===id){t.accountId=to;t.updatedAt=Date.now();} if(t.toAccountId===id){t.toAccountId=to;t.updatedAt=Date.now();} });
      }
      S.accounts=S.accounts.filter(a=>a.id!==id);
      pushUndo("akun dihapus",()=>{ S.tx=JSON.parse(snapshotTx); S.accounts=JSON.parse(snapshotAcc); });
      closeDrawer(); commit(); toast("Akun dihapus",acc.name+(n?" · "+n+" transaksi dipindahkan":""),"warn",{label:"Urungkan",icon:"undo",fn:doUndo}); break;
    }
    case "open-cloud": openSettings("cloud"); break;
    case "dismiss-banner": S.settings.bannerDismissed=true; commit(); break;
    case "set-tab": UI.setTab=v; renderSettings(); break;
    case "close-settings": closeSettings(); break;
    case "toggle": S.settings[v]=!S.settings[v]; commit(); renderSettings(); break;
    case "set-accent": S.settings.accent=v; commit(); renderSettings(); break;
    case "set-provider": S.cloud.provider=v; setSyncState(v==="none"?"local":"ok"); persist(); renderSettings(); renderSyncPill(); break;
    case "test-cloud": testCloud(); break;
    case "sync-now": readCloudFields(); syncNow(true); break;
    case "disconnect": {
      S.cloud.provider="none"; logSync("info","Cloud diputuskan · kembali ke mode lokal");
      setSyncState("local"); persist(); renderSettings(); renderSyncPill(); toast("Cloud diputuskan","Data tetap aman di perangkat ini.","info"); break;
    }
    case "copy-sql": {
      const txt=$("#sqlCode").textContent;
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast("SQL disalin","Tempel di Supabase SQL Editor","ok"),()=>toast("Gagal menyalin","Salin manual dari kotak di atas","warn"));
      else toast("Clipboard tidak tersedia","Salin manual dari kotak di atas","warn");
      break;
    }
    case "export-json": exportJSON(); break;
    case "export-csv": exportCSV(filteredTx(),filteredTx().length+" transaksi terfilter"); break;
    case "export-csv-all": exportCSV(); break;
    case "import-json": $("#importFile").click(); break;
    case "reseed": {
      const snap=JSON.stringify(S);
      const fresh=seedState(); fresh.settings=S.settings; fresh.cloud=S.cloud;
      S=fresh; pushUndo("muat data contoh",()=>{ S=JSON.parse(snap); });
      UI.selected.clear(); commit(); renderSettings();
      toast("Data contoh dimuat",live().length+" transaksi selama 5 bulan","ok",{label:"Urungkan",icon:"undo",fn:doUndo}); break;
    }
    case "wipe": {
      const snap=JSON.stringify(S.tx); const n=live().length; const now=Date.now();
      S.tx.forEach(t=>{ t.deleted=true; t.updatedAt=now; });
      UI.selected.clear(); pushUndo("hapus semua transaksi",()=>{ S.tx=JSON.parse(snap); });
      commit(); renderSettings(); toast(n+" transaksi dihapus","Semua catatan disembunyikan.","warn",{label:"Urungkan",icon:"undo",fn:doUndo}); break;
    }
  }
});
document.addEventListener("change",function(e){
  const t=e.target;
  if(t.id==="selAll"){
    const list=filteredTx();
    if(t.checked) list.forEach(x=>UI.selected.add(x.id)); else list.forEach(x=>UI.selected.delete(x.id));
    renderTxList(); return;
  }
  if(t.dataset.act==="sel-tx"){
    if(t.checked) UI.selected.add(t.dataset.id); else UI.selected.delete(t.dataset.id);
    const row=t.closest(".tx-row"); if(row) row.classList.toggle("sel",t.checked);
    const list=filteredTx(), all=$("#selAll");
    if(all){ const n=list.filter(x=>UI.selected.has(x.id)).length; all.checked=n===list.length&&n>0; all.indeterminate=n>0&&n<list.length; }
    renderBulk(); return;
  }
  if(t.id==="fCat"){ UI.cat=t.value; UI.activeView=null; UI.selected.clear(); renderTxList(); return; }
  if(t.id==="fAcc"){ UI.acc=t.value; UI.activeView=null; UI.selected.clear(); renderTxList(); return; }
  if(t.id==="fPeriod"){ UI.period=t.value; UI.activeView=null; UI.selected.clear(); renderTxList(); return; }
  if(t.id==="fSort"){ UI.sort=t.value; UI.activeView=null; renderTxList(); return; }
  if(t.id==="bulkCat"&&t.value){
    const cid=t.value, ids=Array.from(UI.selected);
    const before=ids.map(id=>{const x=S.tx.find(y=>y.id===id);return x?{id:id,cat:x.categoryId,type:x.type}:null;}).filter(Boolean);
    const kind=catById(cid).kind;
    ids.forEach(id=>{ const x=S.tx.find(y=>y.id===id); if(x&&x.type!=="transfer"){ x.categoryId=cid; if(x.type!==kind) x.type=kind; x.updatedAt=Date.now(); } });
    pushUndo("ubah kategori massal",()=>{ before.forEach(b=>{ const x=S.tx.find(y=>y.id===b.id); if(x){x.categoryId=b.cat;x.type=b.type;x.updatedAt=Date.now();} }); });
    UI.selected.clear(); commit();
    toast(ids.length+" transaksi dipindahkan","Kategori: "+catById(cid).name,"ok",{label:"Urungkan",icon:"undo",fn:doUndo});
    return;
  }
  if(t.dataset.budInput){
    const c=S.categories.find(x=>x.id===t.dataset.budInput); if(!c) return;
    const val=parseAmount(t.value); const before=c.budget;
    c.budget=val>0?val:null;
    pushUndo("perubahan anggaran",()=>{ c.budget=before; });
    commit(); return;
  }
  if(t.dataset.set){
    const k=t.dataset.set; let val=t.value;
    if(k==="weekStart"||k==="syncDelay") val=Number(val);
    S.settings[k]=val; commit(); renderSettings(); return;
  }
  if(t.dataset.cfg){ readCloudFields(); return; }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="quickForm"){ quickSave(e); return; }
  if(e.target.id==="txForm"){ e.preventDefault(); saveTxFromDrawer(); return; }
  if(e.target.id==="accForm"){ e.preventDefault(); saveAccount(); return; }
  e.preventDefault();
});
function readCloudFields(){
  $$("[data-cfg]",$("#setBody")).forEach(i=>{ S.cloud.config[i.dataset.cfg]=i.value.trim(); });
  persist();
}
async function testCloud(){
  readCloudFields();
  if(S.cloud.provider==="none"){ toast("Pilih penyedia dulu",null,"info"); return; }
  const kill=toast("Menguji koneksi…",S.cloud.provider,"info");
  try{
    const r=await Cloud.pull(S.cloud);
    logSync("ok","Uji koneksi berhasil"+(r?" · data cloud ditemukan":" · cloud masih kosong"));
    persist(); renderSettings();
    toast("Koneksi berhasil",r?"Data cloud ditemukan dan siap digabung.":"Cloud kosong — data lokal akan diunggah saat sinkron.","ok");
  }catch(err){
    const msg=(err&&err.name==="AbortError")?"Timeout — periksa URL/koneksi":(err&&err.message)||"Gagal";
    logSync("error","Uji koneksi: "+msg); persist(); renderSettings();
    toast("Koneksi gagal",msg,"error");
  }finally{ kill(); }
}

/* generic drag reorder */
let dragCtx=null;
function setupDnd(container,sel,key,onDrop){
  if(!container) return;
  container.addEventListener("dragstart",e=>{
    const it=e.target.closest(sel); if(!it) return;
    dragCtx={el:it,id:it.getAttribute(key),container:container,sel:sel,key:key};
    it.classList.add("dragging");
    try{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragCtx.id); }catch(err){}
  });
  container.addEventListener("dragover",e=>{
    if(!dragCtx||dragCtx.container!==container) return;
    e.preventDefault(); e.dataTransfer.dropEffect="move";
    const it=e.target.closest(sel);
    $$(sel,container).forEach(x=>x.classList.remove("drop-before","drop-after"));
    if(!it||it===dragCtx.el) return;
    const r=it.getBoundingClientRect();
    it.classList.add((e.clientY-r.top)<r.height/2?"drop-before":"drop-after");
  });
  container.addEventListener("drop",e=>{
    if(!dragCtx||dragCtx.container!==container) return;
    e.preventDefault();
    const it=e.target.closest(sel);
    $$(sel,container).forEach(x=>x.classList.remove("drop-before","drop-after","dragging"));
    if(it&&it!==dragCtx.el){
      const r=it.getBoundingClientRect();
      onDrop(dragCtx.id,it.getAttribute(key),(e.clientY-r.top)<r.height/2);
    }
    dragCtx=null;
  });
  container.addEventListener("dragend",()=>{
    $$(sel,container).forEach(x=>x.classList.remove("drop-before","drop-after","dragging"));
    dragCtx=null;
  });
}
setupDnd($("#savedViews"),"[data-view-id]","data-view-id",(srcId,dstId,before)=>{
  const list=S.views.slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const si=list.findIndex(v=>v.id===srcId); if(si<0) return;
  const item=list.splice(si,1)[0];
  let di=list.findIndex(v=>v.id===dstId); if(di<0) di=list.length;
  list.splice(before?di:di+1,0,item);
  list.forEach((v,i)=>v.order=i); S.views=list; commit();
});
document.addEventListener("dragstart",e=>{
  const it=e.target.closest("[data-bud-id]"); if(!it) return;
  const host=$("#budList"); if(!host) return;
  dragCtx={el:it,id:it.dataset.budId,container:host,sel:"[data-bud-id]"};
  it.classList.add("dragging");
  try{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragCtx.id); }catch(err){}
});
document.addEventListener("dragover",e=>{
  const host=$("#budList"); if(!dragCtx||!host||dragCtx.container!==host) return;
  e.preventDefault();
  const it=e.target.closest("[data-bud-id]");
  $$("[data-bud-id]",host).forEach(x=>x.classList.remove("drop-before","drop-after"));
  if(!it||it===dragCtx.el) return;
  const r=it.getBoundingClientRect();
  it.classList.add((e.clientY-r.top)<r.height/2?"drop-before":"drop-after");
});
document.addEventListener("drop",e=>{
  const host=$("#budList"); if(!dragCtx||!host||dragCtx.container!==host) return;
  e.preventDefault();
  const it=e.target.closest("[data-bud-id]");
  $$("[data-bud-id]",host).forEach(x=>x.classList.remove("drop-before","drop-after","dragging"));
  if(it&&it!==dragCtx.el){
    const r=it.getBoundingClientRect(), before=(e.clientY-r.top)<r.height/2;
    const list=S.categories.filter(c=>c.kind==="out").sort((a,b)=>(a.order||0)-(b.order||0));
    const si=list.findIndex(c=>c.id===dragCtx.id);
    if(si>=0){
      const item=list.splice(si,1)[0];
      let di=list.findIndex(c=>c.id===it.dataset.budId); if(di<0) di=list.length;
      list.splice(before?di:di+1,0,item);
      list.forEach((c,i)=>c.order=i);
      commit();
    }
  }
  dragCtx=null;
});
document.addEventListener("dragend",()=>{
  $$("[data-bud-id]").forEach(x=>x.classList.remove("drop-before","drop-after","dragging"));
});
/* chart interactions */
document.addEventListener("click",e=>{
  const m=e.target.closest("[data-month]");
  if(m){ UI.month=m.dataset.month; commit(); toast("Bulan aktif diubah",mLabel(UI.month),"info"); return; }
  const c=e.target.closest("[data-cat]");
  if(c){
    const id=c.dataset.cat;
    if(id==="__rest"){ UI.cat="all"; UI.type="out"; }
    else { UI.cat=id; UI.type="out"; }
    UI.period="bulan"; UI.activeView=null; go("transaksi"); return;
  }
  const d=e.target.closest("[data-day]");
  if(d){
    const day=d.dataset.day;
    UI.q=""; $("#globalSearch").value="";
    UI.type="out"; UI.cat="all"; UI.acc="all"; UI.period="all"; UI.activeView=null;
    UI.month=day.slice(0,7);
    go("transaksi");
    const list=live().filter(t=>t.date===day&&t.type==="out");
    UI.selected=new Set(list.map(t=>t.id));
    renderTxList();
    toast(list.length+" transaksi pada "+longDate(day),"Terpilih di buku transaksi · kosongkan pilihan untuk melihat semua","info");
    return;
  }
});
/* keyboard */
document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); UI.palette?closePalette():openPalette(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!typing){ e.preventDefault(); doUndo(); return; }
  if(e.key==="Escape"){
    if(UI.palette) closePalette();
    else if(UI.settings) closeSettings();
    else if(UI.drawer) closeDrawer();
    else if(UI.selected.size){ UI.selected.clear(); renderTxList(); }
    return;
  }
  if(typing) return;
  if(e.key==="n"||e.key==="N"){ e.preventDefault(); openDrawer({kind:"tx",mode:"create"}); }
  else if(e.key==="/"){ e.preventDefault(); $("#globalSearch").focus(); }
  else if(e.key==="ArrowLeft"&&e.altKey){ $("#mPrev").click(); }
  else if(e.key==="ArrowRight"&&e.altKey){ $("#mNext").click(); }
});
drawer.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.id!=="dNote"){ e.preventDefault(); if(UI.drawer&&UI.drawer.kind==="tx") saveTxFromDrawer(); }
});
/* connectivity + cross-tab */
window.addEventListener("online",()=>{ renderSyncPill(); if(S.cloud.provider!=="none"){ toast("Kembali online","Mengirim perubahan tertunda…","info"); syncNow(false); } });
window.addEventListener("offline",()=>{ renderSyncPill(); toast("Koneksi terputus","Perubahan tetap disimpan di perangkat ini.","warn"); });
window.addEventListener("storage",e=>{
  if(e.key!==STORE_KEY||!e.newValue) return;
  try{
    const incoming=normalize(JSON.parse(e.newValue));
    if(!incoming) return;
    const keepSettings=S.settings, keepCloud=S.cloud;
    S=incoming; S.settings=keepSettings; S.cloud=keepCloud;
    renderAll();
    if(UI.drawer&&UI.drawer.kind==="tx"&&UI.drawer.mode==="view") renderDrawer();
  }catch(err){}
});
window.addEventListener("resize",debounce(hideTip,120));

S=loadState();
if(!S){ S=seedState(); try{ localStorage.setItem(STORE_KEY,JSON.stringify(S)); }catch(e){ memoryOnly=true; } }

           {id:uid("vw"),name:"Pemasukan bulan ini",order:1,f:{q:"",type:"in",cat:"all",acc:"all",period:"bulan",sort:"date-desc"}}];

bindAmountInputs(document);

},900);
setInterval(()=>{ renderSyncPill(); },60000);

})();
